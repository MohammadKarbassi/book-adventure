<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="ماجراجویی با کتاب">
  <style>
    :root { --ink:#1F2A44; --paper:#FAF5EA; --amber:#F0A93B; --teal:#2E8C93; --mist:#DCEFF0; }
    * { transform-box: fill-box; }
    .loop { animation-duration: 6s; animation-iteration-count: infinite; animation-fill-mode: both; }

    /* 1. covers swing open from the spine (0–0.9s) */
    .page-r { transform-origin: left center; animation-name: openR; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
    .page-l { transform-origin: right center; animation-name: openL; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
    @keyframes openR { 0%,4% { transform: scaleX(0); } 16%,92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes openL { 0%,6% { transform: scaleX(0); } 18%,92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }

    /* 2. glow rises from the pages */
    .glow { transform-origin: center bottom; animation-name: glow; animation-timing-function: ease-out; }
    @keyframes glow { 0%,14% { opacity:0; transform: scale(.4); } 28%,88% { opacity:.55; transform: scale(1); } 100% { opacity:0; transform: scale(1); } }

    /* 3. the trail draws from the book to the peak */
    .trail { stroke-dasharray: 270; animation-name: trail; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    @keyframes trail { 0%,18% { stroke-dashoffset: 270; opacity:1; } 48%,90% { stroke-dashoffset: 0; opacity:1; } 100% { stroke-dashoffset: 0; opacity:0; } }

    /* landscape grows up out of the book */
    .land { transform-origin: center bottom; animation-name: land; animation-timing-function: cubic-bezier(.2,.9,.3,1.2); }
    .land.d2 { animation-delay: .12s; }
    .land.d3 { animation-delay: .24s; }
    @keyframes land { 0%,16% { opacity:0; transform: translateY(30px) scaleY(.3); } 32%,90% { opacity:1; transform: none; } 100% { opacity:0; transform: none; } }

    /* 4. flag pops on the summit */
    .flag { transform-origin: left bottom; animation-name: flag; animation-timing-function: cubic-bezier(.3,1.6,.5,1); }
    @keyframes flag { 0%,46% { transform: scale(0); } 54%,90% { transform: scale(1); } 100% { transform: scale(0); } }
    .cloth { transform-origin: left center; animation: wave 1s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: skewY(-6deg) scaleX(1); } to { transform: skewY(6deg) scaleX(.85); } }

    /* sun rises behind the peak */
    .sun { animation-name: sun; animation-timing-function: ease-out; }
    @keyframes sun { 0%,22% { opacity:0; transform: translateY(40px); } 42%,90% { opacity:1; transform: none; } 100% { opacity:0; } }

    /* birds drift right-to-left (reading direction) */
    .birds { animation-name: birds; animation-timing-function: linear; }
    @keyframes birds { 0%,30% { opacity:0; transform: translateX(80px); } 40% { opacity:1; } 85% { opacity:1; } 100% { opacity:0; transform: translateX(-160px); } }

    /* 5. title */
    .title { animation-name: title; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
    .sub { animation-delay: .25s; }
    @keyframes title { 0%,52% { opacity:0; transform: translateX(24px); } 62%,90% { opacity:1; transform: none; } 100% { opacity:0; } }

    @media (prefers-reduced-motion: reduce) {
      .loop, .cloth { animation: none !important; }
      .trail { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <radialGradient id="g-glow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#F0A93B"/>
      <stop offset="1" stop-color="#F0A93B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF5EA"/>
      <stop offset="1" stop-color="#F6E7C8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g-sky)"/>

  <!-- glow -->
  <ellipse class="glow loop" cx="400" cy="330" rx="260" ry="200" fill="url(#g-glow)"/>

  <!-- sun -->
  <circle class="sun loop" cx="470" cy="110" r="34" fill="#F0A93B" opacity=".9"/>

  <!-- landscape -->
  <path class="land loop d3" d="M250 320 L330 200 L380 260 L420 210 L470 320 Z" fill="#DCEFF0"/>
  <path class="land loop d2" d="M300 320 L400 120 L520 320 Z" fill="#2E8C93"/>
  <path class="land loop d2" d="M372 176 L400 120 L428 176 L414 168 L400 180 L386 168 Z" fill="#FAF5EA"/>
  <path class="land loop" d="M455 320 L520 225 L580 320 Z" fill="#1F2A44" opacity=".85"/>

  <!-- trail from the pages to the summit -->
  <path class="trail loop" d="M400 318 C 360 300, 440 280, 400 262 S 350 230, 392 210 S 430 170, 400 128"
        fill="none" stroke="#F0A93B" stroke-width="4" stroke-linecap="round"/>

  <!-- flag -->
  <g class="flag loop">
    <line x1="400" y1="128" x2="400" y2="86" stroke="#1F2A44" stroke-width="3" stroke-linecap="round"/>
    <path class="cloth" d="M400 88 L426 96 L400 104 Z" fill="#F0A93B"/>
  </g>

  <!-- birds -->
  <g class="birds loop" fill="none" stroke="#1F2A44" stroke-width="2.5" stroke-linecap="round">
    <path d="M560 140 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M600 112 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- open book -->
  <g>
    <path class="page-l loop" d="M400 330 C 360 312, 300 312, 250 322 L250 348 C 300 338, 360 338, 400 356 Z" fill="#FAF5EA" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/>
    <path class="page-r loop" d="M400 330 C 440 312, 500 312, 550 322 L550 348 C 500 338, 440 338, 400 356 Z" fill="#FAF5EA" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/>
    <line x1="400" y1="328" x2="400" y2="358" stroke="#1F2A44" stroke-width="3" stroke-linecap="round"/>
    <rect x="386" y="352" width="28" height="10" rx="3" fill="#F0A93B"/>
  </g>

  <!-- title (Persian, whole-word fade, no per-letter split) -->
  <g class="title loop" direction="rtl" text-anchor="middle" font-family="Vazirmatn, 'Vazir', Tahoma, sans-serif">
    <text x="400" y="404" font-size="30" font-weight="800" fill="#1F2A44">ماجراجویی با <tspan fill="#D98A12">کتاب</tspan></text>
  </g>
  <g class="title sub loop" text-anchor="middle" font-family="Georgia, serif">
    <text x="400" y="430" font-size="14" letter-spacing="4" fill="#2E8C93">BOOK ADVENTURE</text>
  </g>
</svg>
